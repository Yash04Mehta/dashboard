# Netlify: builds the web app, serves dist/, and runs the API as one Netlify Function (netlify/functions/api.mjs, which claims the address /api/*).
# Settings that must be added in Netlify (Site configuration > Environment variables, never in this repo): see the header of netlify/functions/api.mjs and README "Hosting on Netlify".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["config/**"]   # the rate card and template list the cost figures read

# the web app is one page with its own routes (/messages, /chats ...): any other address opens it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
